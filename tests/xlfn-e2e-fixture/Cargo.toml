[package]
name = "xlfn-e2e-fixture"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
xlfn = { version = "0.2.0", path = "../../crates/xlfn", features = ["async"] }

[package.metadata.xlfn]
artifact-name = "FrameworkFixture"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
linker_messages = "deny"
dangling_pointers_from_locals = "deny"
integer_to_ptr_transmutes = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
