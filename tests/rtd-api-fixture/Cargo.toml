[package]
license = "MIT OR Apache-2.0"
name = "xlfn-rtd-api-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace]

[features]
default = []
# Deliberately differ from xlfn's feature names.
streaming = ["framework/rtd"]
objects = ["framework/handles"]

[dependencies]
framework = { package = "xlfn", version = "=0.2.0", path = "../../crates/xlfn" }
