[project]
name = "xlfn-tools"
version = "0.1.0"
description = "Repository verification and maintenance tools for xlfn"
requires-python = ">=3.15,<3.16"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.uv]
required-version = ">=0.13.4"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.terminal]
error-on-warning = true
