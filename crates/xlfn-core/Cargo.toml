[package]
name = "xlfn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe value, lifecycle, registration, and ownership layer for Excel XLLs"

[features]
default = []
shutdown-refinement = []
shutdown-trace = ["shutdown-refinement"]
async = [
    "dep:async-channel",
    "dep:async-task",
    "dep:futures-util",
]
bench-internals = []

[lib]
bench = false

[[bench]]
name = "async_spawn"
harness = false
required-features = ["bench-internals", "async"]

[[bench]]
name = "sync_boundary"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "handle_prepare"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "handle_formula"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "handle_lookup"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "formula_fingerprint"
harness = false
required-features = ["bench-internals"]


[dependencies]
arc-swap.workspace = true
async-channel = { workspace = true, optional = true }
async-task = { workspace = true, optional = true }
blake3.workspace = true
bumpalo.workspace = true
constant_time_eq.workspace = true
futures-util = { workspace = true, optional = true }
getrandom.workspace = true
xlfn-sys.workspace = true
inventory.workspace = true
moka.workspace = true
parking_lot.workspace = true
scopeguard.workspace = true
serde.workspace = true
serde_json.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
xlfn-common.workspace = true

[target.'cfg(windows)'.dependencies]
windows-link.workspace = true

[lints]
workspace = true
