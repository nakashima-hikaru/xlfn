[package]
name = "xlfn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe value, lifecycle, registration, and ownership layer for Excel XLLs"

[features]
default = []
async = [
    "dep:async-channel",
    "dep:async-task",
    "dep:futures-util",
]

[dependencies]
async-channel = { workspace = true, optional = true }
async-task = { workspace = true, optional = true }
blake3.workspace = true
constant_time_eq.workspace = true
futures-util = { workspace = true, optional = true }
getrandom.workspace = true
xlfn-sys.workspace = true
inventory.workspace = true
moka.workspace = true
parking_lot.workspace = true
scopeguard.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
static_assertions.workspace = true
tempfile.workspace = true

# loom/shuttle currently depend on a generator backend without 32-bit Windows
# support. Their architecture-independent models still run on every other host;
# excluding them here lets the Windows x86 RTD tests compile and execute.
[target.'cfg(not(all(target_os = "windows", target_arch = "x86")))'.dev-dependencies]
loom.workspace = true
shuttle.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[lints]
workspace = true
