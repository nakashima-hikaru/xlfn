[package]
name = "xlfn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe value, lifecycle, registration, and ownership layer for Excel XLLs"

[features]
default = []
shutdown-refinement = []
shutdown-trace = ["shutdown-refinement"]
async = [
    "dep:async-channel",
    "dep:async-task",
    "dep:futures-util",
]
bench-internals = []

[lib]
bench = false

[[bench]]
name = "async_spawn"
harness = false
required-features = ["bench-internals", "async"]

[[bench]]
name = "sync_boundary"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "handle_prepare"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "formula_fingerprint"
harness = false
required-features = ["bench-internals"]


[dependencies]
arc-swap.workspace = true
async-channel = { workspace = true, optional = true }
async-task = { workspace = true, optional = true }
blake3.workspace = true
constant_time_eq.workspace = true
futures-util = { workspace = true, optional = true }
getrandom.workspace = true
xlfn-sys.workspace = true
inventory.workspace = true
moka.workspace = true
parking_lot.workspace = true
scopeguard.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
xlfn-common.workspace = true

[dev-dependencies]
criterion.workspace = true
futures-util.workspace = true
proptest.workspace = true
static_assertions.workspace = true
tempfile.workspace = true
xlfn-sys = { workspace = true, features = ["abi-probe"] }

# loom/shuttle currently depend on a generator backend without 32-bit Windows
# support. Their architecture-independent models still run on every other host;
# excluding them here lets the Windows x86 RTD tests compile and execute.
[target.'cfg(not(all(target_os = "windows", target_arch = "x86")))'.dev-dependencies]
loom.workspace = true
shuttle.workspace = true

[target.'cfg(windows)'.dependencies]
windows-link.workspace = true

[lints]
workspace = true
