[package]
name = "xlfn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust framework for building Excel XLL add-ins"
readme = "README.md"

[features]
default = []
async = [
    "dep:async-task",
    "dep:crossbeam-deque",
    "dep:futures-util",
]
# Enables the RTD/COM subsystem and its add-in capability surface.
rtd = []
# Formula handles use the private Excel RTD transport internally, but do not
# expose the generic RTD subscription capability.
handles = []
unstable-cache = ["dep:moka"]
unstable-output = []
refinement = []
bench-internals = ["handles", "dep:rayon", "xlfn-sys/abi-probe"]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
# The backend bridge is a Unix-only dependency, so Windows all-features does
# not enable hotpath's unsupported CPU backend.
hotpath-cpu = ["hotpath", "dep:xlfn-hotpath-cpu"]

[[bench]]
name = "async_spawn"
harness = false
required-features = ["bench-internals", "async"]

[[bench]]
name = "sync_boundary"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "handle_prepare"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "formula_revision"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "handle_lookup"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "handle_lookup_arc_control"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "input_identity"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "formula_caller"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "argument_ingress"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "rtd_publish"
harness = false
required-features = ["bench-internals", "rtd"]

[[bench]]
name = "rtd_refresh"
harness = false
required-features = ["bench-internals", "rtd"]

[[bench]]
name = "rtd_parallel_collection"
harness = false
required-features = ["bench-internals", "rtd"]

[[bench]]
name = "handle_call_resolution"
harness = false
required-features = ["bench-internals"]

[[example]]
name = "rtd_hotpath"
required-features = ["bench-internals", "rtd", "hotpath"]

[dependencies]
xlfn-macros.workspace = true
xlfn-sys.workspace = true
inventory.workspace = true
arc-swap.workspace = true
async-task = { workspace = true, optional = true }
blake3.workspace = true
bumpalo.workspace = true
constant_time_eq.workspace = true
crossbeam-deque = { workspace = true, optional = true }
crossbeam-utils.workspace = true
futures-util = { workspace = true, optional = true }
getrandom.workspace = true
hotpath = { workspace = true, features = ["parking_lot"] }
moka = { workspace = true, optional = true }
parking_lot.workspace = true
rayon = { workspace = true, optional = true }
scopeguard.workspace = true
serde.workspace = true
serde_json.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
triomphe.workspace = true
xlfn-common.workspace = true
xlfn-kernel.workspace = true

[target.'cfg(windows)'.dependencies]
windows-link.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
xlfn-hotpath-cpu = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
futures-util.workspace = true
proptest.workspace = true
static_assertions.workspace = true
tempfile.workspace = true
trybuild.workspace = true
xlfn-sys = { workspace = true, features = ["abi-probe"] }

[target.'cfg(not(all(target_os = "windows", target_arch = "x86")))'.dev-dependencies]
loom.workspace = true
shuttle.workspace = true

[lints]
workspace = true
