[package]
name = "cargo-xlfn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-crate project, diagnostics, and packaging CLI for xlfn"
readme = "README.md"

[[bin]]
name = "cargo-xlfn"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
cargo_metadata.workspace = true
xlfn-package.workspace = true
fs-err.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-link.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
linker_messages = "deny"
dead_code_pub_in_binary = "deny"
dangling_pointers_from_locals = "deny"
integer_to_ptr_transmutes = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
