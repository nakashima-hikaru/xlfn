[package]
name = "xlfn-package"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "XLL bundle validation, PE dependency checks, and package staging"
readme = "README.md"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["i686-pc-windows-msvc"]
# docs.rs cross-compiles from Linux without the MSVC assembler.
features = ["blake3/pure"]

[dependencies]
fs-err.workspace = true
object.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
blake3.workspace = true
tempfile.workspace = true
thiserror.workspace = true
triomphe.workspace = true
xlfn-common.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-link.workspace = true

[dev-dependencies]
proptest.workspace = true
trybuild.workspace = true

[lints]
workspace = true
