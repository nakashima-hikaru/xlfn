name: Deploy user guide

"on":
  push:
    branches:
      - main
    paths:
      - guide/**
      - tools/pyproject.toml
      - tools/uv.lock
      - tools/.python-version
      - Justfile
      - .github/workflows/deploy-guide.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate mdBook
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      - name: Install guide validation tools
        uses: taiki-e/install-action@c0490f106137e0aeeac1aa8d0309826fda08c18d
        with:
          tool: just@1.58.0,mdbook@0.5.4
          fallback: none

      - name: Build and validate the user guide and its Rust examples
        run: just guide-check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: guide/book

  deploy:
    name: Deploy validated guide
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
