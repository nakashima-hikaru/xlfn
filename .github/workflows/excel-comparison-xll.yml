name: Excel comparison XLLs (x86_64)

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: excel-comparison-xll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build xlfn and NativeAOT Excel-DNA XLLs
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Install x86_64 MSVC target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Check benchmark plan
        shell: pwsh
        run: python -B -m unittest discover -s benchmarks/excel-comparison -p 'test_*.py'

      - name: Test fixture control and RTD concurrency
        shell: pwsh
        run: |
          cargo test --manifest-path benchmarks/excel-comparison/xlfn/Cargo.toml --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project benchmarks/excel-comparison/control-tests/ControlTests.csproj -- normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project benchmarks/excel-comparison/control-tests/ControlTests.csproj --no-build -- emergency
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build xlfn and NativeAOT Excel-DNA fixtures
        shell: pwsh
        run: ./benchmarks/excel-comparison/build.ps1

      - name: Record and verify CI artifacts
        shell: pwsh
        run: |
          $root = "benchmarks/excel-comparison/artifacts"
          python benchmarks/excel-comparison/artifact_manifest.py create `
            --root $root `
            --commit $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/excel-comparison/artifact_manifest.py verify `
            --root $root `
            --commit $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload x86_64 XLLs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: excel-comparison-x86_64
          path: benchmarks/excel-comparison/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  consume:
    name: Download and validate XLL artifact
    needs: build
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download XLLs produced by build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: excel-comparison-x86_64
          path: benchmarks/excel-comparison/artifacts/

      - name: Verify downloaded XLLs and provenance
        shell: pwsh
        run: |
          python benchmarks/excel-comparison/artifact_manifest.py verify `
            --root benchmarks/excel-comparison/artifacts `
            --commit $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
