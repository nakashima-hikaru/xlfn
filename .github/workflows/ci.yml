name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and guide
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: >-
          cargo clippy
          --workspace
          --exclude excel-abi-probe
          --all-targets
          --all-features
          --locked
          --
          -D warnings

      - name: Check facade feature combinations
        run: |
          cargo check --package xlfn --locked
          cargo check --package xlfn --features async --locked

      - name: Run Rust tests
        run: >-
          cargo test
          --workspace
          --exclude excel-abi-probe
          --all-targets
          --all-features
          --locked

      - name: Validate the user guide
        run: python guide/check.py

  windows-artifact:
    name: Windows artifact (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-pc-windows-msvc
          - x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Windows-targeted tests
        shell: pwsh
        run: |
          cargo test `
            --workspace `
            --exclude excel-abi-probe `
            --all-targets `
            --all-features `
            --target ${{ matrix.target }} `
            --locked

      - name: Build and validate the basic example XLL
        shell: pwsh
        run: |
          cargo run --locked --package cargo-xlfn -- check `
            --manifest-path examples/basic-xll/Cargo.toml `
            --target ${{ matrix.target }} `
            --locked

      - name: Build and validate the async/RTD fixture XLL
        shell: pwsh
        run: |
          cargo run --locked --package cargo-xlfn -- check `
            --manifest-path tests/xlfn-e2e-fixture/Cargo.toml `
            --target ${{ matrix.target }} `
            --locked

  lean:
    name: Lean shutdown model
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject unfinished proof placeholders
        shell: bash
        run: |
          if grep -RInE --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' formal; then
            echo "Lean proof placeholders are not allowed under formal/." >&2
            exit 1
          fi

      - name: Build and independently check Lean declarations
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          leanchecker: true
          use-mathlib-cache: false
