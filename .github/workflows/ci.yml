name: CI

"on":
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    portable-quality:
        name: Portable quality and tooling
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.13"

            - name: Install development tools
              uses: taiki-e/install-action@c0490f106137e0aeeac1aa8d0309826fda08c18d
              with:
                  tool: just,cargo-semver-checks@0.50.0,cargo-deny@0.20.2,mdbook@0.5.4
                  fallback: none

            - name: Verify generated Windows bindings
              run: |
                  cargo run --locked --package xlfn-windows-bindings-gen
                  git diff --exit-code -- \
                    crates/xlfn-sys/src/win32.rs \
                    crates/xlfn/src/win32.rs \
                    crates/xlfn-package/src/win32.rs \
                    crates/cargo-xlfn/src/win32.rs

            - name: Check dependency advisories, licenses, bans, and sources
              run: just deny

            - name: Check formatting
              run: just fmt

            - name: Check public API compatibility
              run: just semver

            - name: Build the user guide
              run: mdbook build guide

            - name: Validate the user guide
              run: python guide/check.py

    rust-quality-windows:
        name: Rust quality (windows-latest)
        runs-on: windows-latest
        env:
            RUSTFLAGS: -Dlinker-messages
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install development tools
              uses: taiki-e/install-action@c0490f106137e0aeeac1aa8d0309826fda08c18d
              with:
                  tool: just,cargo-nextest,cargo-hack
                  fallback: none

            - name: Run Clippy
              run: just clippy

            - name: Check feature combinations
              run: just features

            - name: Check benchmark compilation
              run: just bench-check

            - name: Run Rust tests
              run: just test-ci

            - name: Model-check handle close race
              run: >-
                  cargo test
                  --package xlfn
                  --all-features
                  shuttle_insert_racing_close_never_leaves_a_live_handle
                  --locked
                  --
                  --ignored

            - name: Check and lint standalone consumers
              shell: pwsh
              run: |
                  cargo check --manifest-path examples/basic-xll/Cargo.toml --locked
                  cargo clippy --manifest-path examples/basic-xll/Cargo.toml --all-targets --locked -- -D warnings
                  cargo check --manifest-path examples/rtd-source/Cargo.toml --locked
                  cargo clippy --manifest-path examples/rtd-source/Cargo.toml --all-targets --locked -- -D warnings
                  cargo check --manifest-path tests/xlfn-e2e-fixture/Cargo.toml --locked
                  cargo clippy --manifest-path tests/xlfn-e2e-fixture/Cargo.toml --all-targets --locked -- -D warnings

    windows-artifact:
        name: Windows artifact (${{ matrix.target }})
        runs-on: windows-latest
        env:
            RUSTFLAGS: -Dlinker-messages
        strategy:
            fail-fast: false
            matrix:
                target:
                    - i686-pc-windows-msvc
                    - x86_64-pc-windows-msvc
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Reject direct windows-sys dependencies
              shell: pwsh
              run: |
                  $matches = Get-ChildItem crates -Recurse -Filter Cargo.toml |
                    Select-String -Pattern '^\s*windows-sys\s*='
                  if ($matches) {
                    $matches | ForEach-Object { Write-Error $_ }
                    exit 1
                  }

            - name: Run Windows-targeted tests
              shell: pwsh
              env:
                  RUSTFLAGS: -Dlinker-messages
                  XLFN_WINDOWS_RTD_TRACE: ${{ github.workspace }}\windows-rtd-shutdown-trace-${{ matrix.target }}.json
                  XLFN_HANDLE_REFINEMENT_TRACE_DIR: ${{ github.workspace }}\windows-handle-refinement-traces-${{ matrix.target }}
              run: |
                  cargo test `
                    --workspace `
                    --all-targets `
                    --all-features `
                    --target ${{ matrix.target }} `
                    --locked

            - name: Upload Windows RTD shutdown trace
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: windows-rtd-shutdown-trace-${{ matrix.target }}
                  path: windows-rtd-shutdown-trace-${{ matrix.target }}.json
                  if-no-files-found: error

            - name: Upload Windows H4 handle refinement traces
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: windows-handle-refinement-traces-${{ matrix.target }}
                  path: windows-handle-refinement-traces-${{ matrix.target }}
                  if-no-files-found: error

            - name: Build and validate the basic example XLL across CRT policies
              shell: pwsh
              env:
                  RUSTFLAGS: -Dlinker-messages
              run: |
                  foreach ($crt in @("static", "dynamic", "inherit")) {
                    cargo run --locked --package cargo-xlfn -- check `
                      --manifest-path examples/basic-xll/Cargo.toml `
                      --target ${{ matrix.target }} `
                      --crt $crt `
                      --locked
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }

            - name: Build and validate the async/RTD fixture XLL across CRT policies
              shell: pwsh
              env:
                  RUSTFLAGS: -Dlinker-messages
              run: |
                  foreach ($crt in @("static", "dynamic", "inherit")) {
                    cargo run --locked --package cargo-xlfn -- check `
                      --manifest-path tests/xlfn-e2e-fixture/Cargo.toml `
                      --target ${{ matrix.target }} `
                      --crt $crt `
                      --locked
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }

    excel-abi-probe:
        name: Excel SDK ABI probe (${{ matrix.target }})
        runs-on: windows-latest
        env:
            RUSTFLAGS: -Dlinker-messages
        strategy:
            fail-fast: false
            matrix:
                target:
                    - i686-pc-windows-msvc
                    - x86_64-pc-windows-msvc
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download and extract the pinned Excel SDK
              shell: pwsh
              run: |
                  $sdkUrl = "https://download.microsoft.com/download/d/a/c/dac9c321-279c-4625-b381-bcb044eef7b2/excelxllsdk.msi"
                  $sdkSha256 = "1a59a4877f80881d0e8e931f39d5507b3a4eea97fa18008554c425d7df013930"
                  $sdkRoot = Join-Path $env:RUNNER_TEMP "excel-xll-sdk"
                  $msi = Join-Path $env:RUNNER_TEMP "excelxllsdk.msi"
                  New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
                  Invoke-WebRequest -Uri $sdkUrl -OutFile $msi
                  $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi).Hash.ToLowerInvariant()
                  if ($actual -ne $sdkSha256) {
                    throw "Excel XLL SDK digest mismatch: expected $sdkSha256, got $actual"
                  }
                  $signature = Get-AuthenticodeSignature -FilePath $msi
                  if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
                    throw "Excel XLL SDK signature verification failed"
                  }
                  $install = Start-Process -FilePath msiexec.exe -ArgumentList @(
                    "/a", "`"$msi`"", "/qn", "TARGETDIR=`"$sdkRoot`""
                  ) -Wait -PassThru
                  if ($install.ExitCode -ne 0) {
                    throw "Excel XLL SDK extraction failed with exit code $($install.ExitCode)"
                  }
                  $header = Get-ChildItem -Path $sdkRoot -Filter XLCALL.H -File -Recurse |
                    Select-Object -First 1
                  if ($null -eq $header) {
                    throw "XLCALL.H was not found in the extracted Excel XLL SDK"
                  }
                  "XLFN_SDK_INCLUDE=$($header.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - name: Run the SDK-backed ABI probe
              shell: pwsh
              env:
                  RUSTFLAGS: -Dlinker-messages
              run: >
                  cargo test
                  --manifest-path probes/excel-abi-probe/Cargo.toml
                  --features sdk-bindgen
                  --target ${{ matrix.target }}
                  --locked

    lean:
        name: Lean formal models
        runs-on: ubuntu-latest
        needs: windows-artifact
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download Windows RTD shutdown traces
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: windows-rtd-shutdown-trace-*
                  path: windows-rtd-shutdown-traces
                  merge-multiple: true

            - name: Download Windows H4 handle refinement traces
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: windows-handle-refinement-traces-*
                  path: windows-handle-refinement-traces

            - name: Reject unfinished proof placeholders
              shell: bash
              run: |
                  if grep -RInE --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' formal; then
                    echo "Lean proof placeholders are not allowed under formal/." >&2
                    exit 1
                  fi

            - name: Build and independently check Lean declarations
              uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
              with:
                  lake-package-directory: formal
                  build: true
                  leanchecker: true
                  use-mathlib-cache: false
                  use-github-cache: false

            - name: Build the shutdown trace checker executable
              working-directory: formal
              run: lake build shutdown_trace_checker

            - name: Build the composition trace checker executable
              working-directory: formal
              run: lake build composition_trace_checker

            - name: Build the published handle refinement checker executable
              working-directory: formal
              run: lake build published_trace_checker

            - name: Build the RTD serialization golden checker
              working-directory: formal
              run: lake build serialization_golden_checker

            - name: Validate RTD serialization golden vectors
              working-directory: formal
              run: lake exe serialization_golden_checker < fixtures/topics/serialization-golden.json

            - name: Validate composition replay fixtures
              shell: bash
              run: |
                  for trace in formal/fixtures/composition/*.json; do
                    formal/.lake/build/bin/composition_trace_checker < "$trace"
                  done

            - name: Validate Windows RTD shutdown traces
              shell: bash
              run: |
                  traces=(windows-rtd-shutdown-traces/*.json)
                  if [ "${#traces[@]}" -eq 0 ]; then
                    echo "No Windows RTD shutdown traces were downloaded." >&2
                    exit 1
                  fi
                  for trace in "${traces[@]}"; do
                    formal/.lake/build/bin/shutdown_trace_checker < "$trace"
                  done

            - name: Validate Windows H4 handle refinement traces
              shell: bash
              run: |
                  trace_root=windows-handle-refinement-traces
                  targets=(
                    i686-pc-windows-msvc
                    x86_64-pc-windows-msvc
                  )
                  total=0
                  for target in "${targets[@]}"; do
                    directory="$trace_root/windows-handle-refinement-traces-$target"
                    if [ ! -d "$directory" ]; then
                      echo "Missing Windows H4 trace artifact directory: $directory" >&2
                      exit 1
                    fi
                    count=$(find "$directory" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
                    if [ "$count" -ne 6 ]; then
                      echo "Expected 6 H4 traces for $target, found $count." >&2
                      exit 1
                    fi
                    while IFS= read -r -d '' trace; do
                      formal/.lake/build/bin/published_trace_checker < "$trace"
                    done < <(find "$directory" -maxdepth 1 -type f -name '*.json' -print0 | sort -z)
                    total=$((total + count))
                  done
                  if [ "$total" -ne 12 ]; then
                    echo "Expected 12 Windows H4 traces, found $total." >&2
                    exit 1
                  fi

            - name: Reject invalid H4 handle refinement fixtures
              shell: bash
              run: |
                  for trace in formal/fixtures/handle-refinement/negative-*.json; do
                    if formal/.lake/build/bin/published_trace_checker < "$trace"; then
                      echo "Negative H4 fixture was accepted: $trace" >&2
                      exit 1
                    fi
                  done

            - name: Validate a Rust-generated shutdown trace
              env:
                  XLFN_SHUTDOWN_CHECKER: ${{ github.workspace }}/formal/.lake/build/bin/shutdown_trace_checker
              run: >-
                  cargo test
                  --package xlfn
                  --lib
                  --features "async shutdown-refinement"
                  rust_shutdown_resource_traces_are_accepted_by_lean_checker
                  --locked
                  --
                  --ignored

            - name: Validate a Rust-generated composition trace
              env:
                  XLFN_COMPOSITION_CHECKER: ${{ github.workspace }}/formal/.lake/build/bin/composition_trace_checker
                  XLFN_COMPOSITION_TRACE: ${{ github.workspace }}/rust-composition-trace.json
                  XLFN_COMPOSITION_TAKEOVER_TRACE: ${{ github.workspace }}/rust-composition-owner-takeover-trace.json
                  XLFN_COMPOSITION_TRACE_DIR: ${{ github.workspace }}
              run: >-
                  cargo test
                  --package xlfn
                  --lib
                  --features "async shutdown-refinement"
                  rust_composition
                  --locked
                  --
                  --ignored

            - name: Upload Rust composition traces
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: rust-composition-traces
                  path: |
                      rust-composition-trace.json
                      rust-composition-owner-takeover-trace.json
                      rust-composition-uncommitted-trace.json
                      rust-composition-open-rollback-trace.json
                      rust-composition-already-closed-trace.json
                      rust-composition-reopen-trace.json
                  if-no-files-found: error
