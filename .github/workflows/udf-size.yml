name: Generated UDF size experiment

"on":
  pull_request:
    paths:
      - .github/workflows/udf-size.yml
      - benchmarks/excel-comparison/measure-udf-size.ps1
      - crates/xlfn/src/return_abi.rs
      - crates/xlfn/src/return_abi/**
      - crates/xlfn-macros/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: udf-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Measure x64 PE size and scalar boundary on the same runner
        shell: pwsh
        run: |
          $measure = Join-Path $PWD "candidate/benchmarks/excel-comparison/measure-udf-size.ps1"
          $root = Join-Path $PWD "udf-size-results"
          $variants = @("candidate")
          if (Test-Path baseline) { $variants = @("baseline", "candidate") }
          foreach ($variant in $variants) {
            $out = Join-Path $root $variant
            & $measure -Output $out -Repository $variant
            $env:CARGO_TARGET_DIR = Join-Path $out "target"
            Push-Location $variant
            try {
              cargo bench --locked -p xlfn --features bench-internals --bench sync_boundary -- "sync_boundary/scalar_return/no_subscriber/1$" --noplot 2>&1 |
                Set-Content (Join-Path $out "scalar-boundary.log")
              if ($LASTEXITCODE -ne 0) {
                Get-Content (Join-Path $out "scalar-boundary.log")
                exit $LASTEXITCODE
              }
              if (!(Select-String -Quiet -Path (Join-Path $out "scalar-boundary.log") -Pattern 'time:')) {
                throw "No scalar boundary measurements in $variant"
              }
            } finally {
              Pop-Location
            }
          }
          foreach ($variant in $variants) {
            Get-Content (Join-Path $root "$variant/summary.json")
            Get-Content (Join-Path $root "$variant/scalar-boundary.log") -Tail 10
          }
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x64-udf-size
          path: |
            udf-size-results/*/summary.json
            udf-size-results/*/scalar-boundary.log
            udf-size-results/*/udfs-*/*
          if-no-files-found: warn
