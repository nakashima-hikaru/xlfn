name: Rust toolchain comparison

"on":
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Revision that builds with Rust 1.98.1
        required: true
        default: b9596f8e221ef3804bb802c0795d7e7e8660f8df
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Rust 1.98.1 vs 1.99.0 (${{ matrix.target }})
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-pc-windows-msvc
          - x86_64-pc-windows-msvc
    steps:
      - name: Check out candidate and baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install paired toolchains
        shell: pwsh
        env:
          COMPARISON_TARGET: ${{ matrix.target }}
        run: |
          foreach ($version in @("1.98.1", "1.99.0")) {
            rustup toolchain install $version --profile minimal --target $env:COMPARISON_TARGET
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Measure framework workloads and registration size curves
        shell: pwsh
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          COMPARISON_TARGET: ${{ matrix.target }}
        run: |
          python -B benchmarks/performance/toolchain_compare.py `
            --baseline-ref $env:BASELINE_REF `
            --candidate-ref $env:GITHUB_SHA `
            --target $env:COMPARISON_TARGET `
            --work-dir "target/toolchain-comparison/$env:COMPARISON_TARGET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve measurements, provenance and frozen binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-toolchain-comparison-${{ matrix.target }}
          path: |
            target/toolchain-comparison/${{ matrix.target }}/paired.json
            target/toolchain-comparison/${{ matrix.target }}/plan.json
            target/toolchain-comparison/${{ matrix.target }}/*provenance.json
            target/toolchain-comparison/${{ matrix.target }}/*.jsonl
            target/toolchain-comparison/${{ matrix.target }}/*.command.json
            target/toolchain-comparison/${{ matrix.target }}/*.stderr
            target/toolchain-comparison/${{ matrix.target }}/size-binaries/
            target/toolchain-comparison/${{ matrix.target }}/paired/
          if-no-files-found: warn
