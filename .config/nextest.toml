[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
inherits = "default"
fail-fast = false
global-timeout = "20m"

[test-groups]
windows-rtd = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(xlfn-core) and test(/^rtd::windows::tests::/)'
platform = 'cfg(windows)'
test-group = 'windows-rtd'
slow-timeout = { period = "60s", terminate-after = 3 }
