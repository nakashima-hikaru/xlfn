# cargo-deny configuration for xlfn

[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "constant_time_eq@0.4.2", reason = "Required transitively by blake3 1.8.7 while xlfn uses constant_time_eq 0.5.0 directly." },
    { crate = "object@0.36.7", reason = "Required transitively by hotpath 0.24.0 while xlfn-package uses object 0.40.0 directly for PE inspection." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
