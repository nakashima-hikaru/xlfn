# cargo-deny configuration for xlfn

[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "constant_time_eq@0.4.2", reason = "Required transitively by blake3 1.8.7 while xlfn uses constant_time_eq 0.5.0 directly." },
    { crate = "windows-link@0.2.1", reason = "Required transitively by windows-sys 0.61.2 and parking_lot_core while xlfn uses windows-link 0.100.0 directly." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
