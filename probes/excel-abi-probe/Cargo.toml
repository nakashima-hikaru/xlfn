[package]
name = "excel-abi-probe"
version = "0.2.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[features]
sdk-bindgen = ["dep:bindgen", "dep:cc", "dep:xlfn-sys"]

[dependencies]
xlfn-sys = { version = "=0.2.0", path = "../../crates/xlfn-sys", features = ["abi-probe"], optional = true }

[build-dependencies]
bindgen = { version = "0.73.2", optional = true }
cc = { version = "1.8.0", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
raw_borrows_via_references = "deny"
unused_must_use = "deny"
linker_messages = "deny"
dangling_pointers_from_locals = "deny"
integer_to_ptr_transmutes = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
