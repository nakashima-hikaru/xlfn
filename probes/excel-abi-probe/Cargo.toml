[package]
name = "excel-abi-probe"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[features]
sdk-bindgen = ["dep:bindgen"]

[dependencies]
xlfn-sys = { version = "=0.2.0", path = "../../crates/xlfn-sys", features = ["abi-probe"] }

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cc = "1.4.4"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
linker_messages = "deny"
dangling_pointers_from_locals = "deny"
integer_to_ptr_transmutes = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
