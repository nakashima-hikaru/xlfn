[project]
name = "xlfn-excel-comparison"
version = "0.1.0"
description = "Windows Excel COM benchmark suite comparing xlfn and Excel-DNA"
requires-python = ">=3.15,<3.16"
dependencies = [
    "psutil>=7.0.0",
    "pywin32>=310; sys_platform == 'win32'",
    "typer>=0.15.0",
]

[project.scripts]
excel-comparison = "xlfn_excel_comparison.cli:app"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.terminal]
error-on-warning = true
